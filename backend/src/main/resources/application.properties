spring.application.name=smart-canteen-backend
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/canteendb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
canteen.jwt.secret=${JWT_SECRET}
canteen.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173